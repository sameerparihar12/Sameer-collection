<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sameer Collection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sameer Collection – Stylish and comfortable shoes for men, women and sports." />
  <meta name="author" content="Sameer Collection" />

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
    body{background:#f9fafb;color:#1f2937}

    header{
      background:linear-gradient(90deg,#111827,#2563eb);
      color:#fff;padding:1rem 2rem;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:1000
    }

    .logo{font-family:Poppins;font-size:1.8rem;font-weight:700}

    nav a{
      color:#fff;margin-left:1.2rem;
      text-decoration:none;font-weight:600
    }

    .cart-btn{
      background:#fff;color:#111827;
      padding:.5rem 1rem;border-radius:8px;
      cursor:pointer;font-weight:600
    }

    .hero{
      padding:4rem 2rem;text-align:center;
      background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
      url("https://images.unsplash.com/photo-1542291026-7eec264c27ff");
      background-size:cover;color:#fff
    }

    .hero h1{font-size:2.5rem;font-family:Poppins}
    .hero p{font-size:1.1rem;margin-top:.5rem}

    .filters{text-align:center;padding:1.5rem}
    .filters select{padding:.6rem 1rem;border-radius:8px}

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:1.5rem;padding:2rem
    }

    .product{
      background:#fff;padding:1rem;
      border-radius:12px;text-align:center;
      box-shadow:0 6px 12px rgba(0,0,0,.1)
    }

    .product img{
      width:100%;height:180px;
      object-fit:cover;border-radius:10px
    }

    .product h3{margin:.7rem 0;font-family:Poppins}
    .price{color:#2563eb;font-weight:700}

    .product button{
      margin-top:.5rem;
      background:#2563eb;color:#fff;
      border:none;padding:.6rem 1.2rem;
      border-radius:8px;cursor:pointer
    }

    #cart{
      position:fixed;bottom:20px;right:20px;
      background:#fff;padding:1rem;
      border-radius:12px;width:300px;
      display:none;box-shadow:0 6px 12px rgba(0,0,0,.2)
    }

    #cart ul{list-style:none;margin:.5rem 0}
    #cart button{width:100%;margin-top:.5rem}

    .modal{
      display:none;position:fixed;
      top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,.6);
      justify-content:center;align-items:center
    }

    .modal-content{
      background:#fff;padding:2rem;
      border-radius:12px;width:90%;max-width:400px
    }

    footer{
      background:#111827;color:#fff;
      text-align:center;padding:1.5rem;margin-top:2rem
    }
  </style>
</head>

<body onload="loadCart()">

<header>
  <div class="logo">👟 Sameer Collection</div>
  <div class="cart-btn" onclick="toggleCart()">
    <i class="fas fa-shopping-cart"></i> (<span id="cart-count">0</span>)
  </div>
</header>

<section class="hero">
  <h1>Step Into Style & Comfort</h1>
  <p>Premium shoes for men, women & sports</p>
</section>

<section class="filters">
  <select onchange="filterProducts(this.value)">
    <option value="all">All Shoes</option>
    <option value="men">Men</option>
    <option value="women">Women</option>
    <option value="sports">Sports</option>
  </select>
</section>

<section class="products" id="productList">
  <div class="product" data-category="men">
    <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77">
    <h3>Men Casual Shoes</h3>
    <p class="price">₹1499</p>
    <button onclick="addToCart('Men Casual Shoes',1499)">Add to Cart</button>
  </div>

  <div class="product" data-category="women">
    <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772">
    <h3>Women Fashion Shoes</h3>
    <p class="price">₹1699</p>
    <button onclick="addToCart('Women Fashion Shoes',1699)">Add to Cart</button>
  </div>

  <div class="product" data-category="sports">
    <img src="https://images.unsplash.com/photo-1514989940723-e8e51635b782">
    <h3>Sports Running Shoes</h3>
    <p class="price">₹1999</p>
    <button onclick="addToCart('Sports Running Shoes',1999)">Add to Cart</button>
  </div>
</section>

<div id="cart">
  <h3>Your Cart</h3>
  <ul id="cartItems"></ul>
  <p><b>Total: ₹<span id="total">0</span></b></p>
  <button onclick="payNow()">Pay Now</button>
</div>

<footer>
  <p>📧 sameerparihar857@gmail.com | 📞 7247255824</p>
  <p>© 2025 Sameer Collection</p>
</footer>

<script>
let cart = {};

function loadCart(){
  const c = localStorage.getItem("cart");
  if(c) cart = JSON.parse(c);
  updateCart();
}

function addToCart(item,price){
  if(!cart[item]) cart[item]={qty:0,price};
  cart[item].qty++;
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCart();
}

function updateCart(){
  const ul=document.getElementById("cartItems");
  ul.innerHTML="";
  let total=0,count=0;
  for(let i in cart){
    total+=cart[i].qty*cart[i].price;
    count+=cart[i].qty;
    ul.innerHTML+=`<li>${i} x${cart[i].qty}</li>`;
  }
  document.getElementById("total").innerText=total;
  document.getElementById("cart-count").innerText=count;
}

function toggleCart(){
  const c=document.getElementById("cart");
  c.style.display=c.style.display==="block"?"none":"block";
}

function filterProducts(cat){
  document.querySelectorAll(".product").forEach(p=>{
    p.style.display = (cat==="all"||p.dataset.category===cat)?"block":"none";
  });
}

function payNow(){
  let total=0;
  for(let i in cart). total+=cart[i].qty*cart[i].price;
  if(total===0){alert("Cart is empty");return;}

  var options={
    key:"rzp_test_YOUR_KEY_HERE", // 🔴 CHANGE THIS
    amount:total*100,
    currency:"INR",
    name:"Sameer Collection",
    description:"Shoe Purchase",
    handler:function(res){
      alert("Payment Successful!");
      cart={};
      localStorage.removeItem("cart");
      updateCart();
      toggleCart();
    }
  };
  new Razorpay(options).open();
}
</script>

</body>
</html>
